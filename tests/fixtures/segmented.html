<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Segmented fixture</title>
<style>body{font:16px/1.5 system-ui;background:#fff;margin:24px}.seg{position:relative;display:inline-flex;background:#f1f1f4;border-radius:999px;padding:4px}
.thumb{position:absolute;top:4px;left:4px;width:96px;height:36px;border-radius:999px;background:#18181b}
.seg label{position:relative;width:96px;height:36px;display:grid;place-items:center;font-weight:600}
.seg label.on{color:#fff}.seg input{position:absolute;opacity:0}</style></head>
<body><fieldset class="seg"><legend class="sr">Billing</legend><span class="thumb" aria-hidden="true"></span>
<label class="on"><input type="radio" name="b" checked>Monthly</label><label><input type="radio" name="b">Annual</label></fieldset>
<p style="color:#bbb">Low contrast paragraph that must still be reported.</p></body></html>
